<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team erstellen | Bier + X-Pongturnier</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="subpage-header">
        <a href="index.html" class="back-btn">← Zurück zur Übersicht</a>
        <h1 class="section-title pink-glow">👥 Team erstellen</h1>
        <p class="subtitle">Melde dein 2er-Team für das Turnier an.</p>
      </div>

      <section class="content-box card-pink" style="margin-bottom: 1.5rem">
        <div class="form-group">
          <label>Teamname</label>
          <input
            type="text"
            class="input-field"
            placeholder="z. B. Ajax Dauerstramm"
          />
        </div>
        <div class="form-group">
          <label>Spieler 1</label>
          <input
            type="text"
            class="input-field"
            placeholder="Vorname / Spitzname"
          />
        </div>
        <div class="form-group">
          <label>Spieler 2</label>
          <input
            type="text"
            class="input-field"
            placeholder="Vorname / Spitzname"
          />
        </div>
        <button
          class="btn-neon btn-pink"
          onclick="
            alert('Prototyp-Hinweis: Team würde hier gespeichert werden!')
          "
        >
          🚀 Team verbindlich anmelden
        </button>
      </section>

      <section
        class="content-box"
        style="border: 1px solid rgba(255, 255, 255, 0.1)"
      >
        <h2 style="font-size: 1.05rem">Bereits angemeldete Teams (3/16)</h2>
        <div class="dummy-list">
          <div class="list-item">
            <div>
              <strong>🍺 Die Becherovka-Brüder</strong>
              <span>Max & Lukas</span>
            </div>
            <span class="badge badge-pink">#1</span>
          </div>
          <div class="list-item">
            <div>
              <strong>🎯 Beer Pressure</strong>
              <span>Sarah & Jonas</span>
            </div>
            <span class="badge badge-pink">#2</span>
          </div>
          <div class="list-item">
            <div>
              <strong>🏓 Pong Stars</strong>
              <span>Tim & Leon</span>
            </div>
            <span class="badge badge-pink">#3</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
