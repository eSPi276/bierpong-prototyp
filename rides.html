<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mitfahrersuche | Bier + X-Pongturnier</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="subpage-header">
        <a href="index.html" class="back-btn">← Zurück zur Übersicht</a>
        <h1 class="section-title pink-glow">🚗 Mitfahrersuche</h1>
        <p class="subtitle">
          Biete freie Plätze an oder reserviere dir einen Sitzplatz.
        </p>
      </div>

      <section class="content-box card-pink" style="margin-bottom: 1.5rem">
        <div class="form-group">
          <label>Fahrer / Name</label>
          <input type="text" class="input-field" placeholder="Dein Name" />
        </div>
        <div class="form-group">
          <label>Startort & Abfahrtszeit</label>
          <input
            type="text"
            class="input-field"
            placeholder="z. B. Hauptbahnhof, 17:30 Uhr"
          />
        </div>
        <div class="form-group">
          <label>Freie Plätze</label>
          <input type="number" class="input-field" value="3" min="1" max="8" />
        </div>
        <button
          class="btn-neon btn-pink"
          onclick="alert('Prototyp-Hinweis: Fahrtangebot eingetragen!')"
        >
          🚗 Fahrt anbieten
        </button>
      </section>

      <section
        class="content-box"
        style="border: 1px solid rgba(255, 255, 255, 0.1)"
      >
        <h2 style="font-size: 1.05rem">Verfügbare Fahrten</h2>
        <div class="dummy-list">
          <div class="list-item">
            <div>
              <strong>Auto von Jonas</strong>
              <span>Start: Innenstadt (17:45 Uhr)</span>
            </div>
            <span class="badge badge-cyan">2 Plätze frei</span>
          </div>
          <div class="list-item">
            <div>
              <strong>Auto von Lisa</strong>
              <span>Start: Bahnhof Süd (18:00 Uhr)</span>
            </div>
            <span class="badge badge-pink">Voll belegt</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
